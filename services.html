<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compte Netflix — Kiffer Entreprise</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-shell">
      <div class="container" style="padding: 28px 0 64px">
      <div class="breadcrumbs"><a href="index.html">Accueil</a> / Netflix</div>
      <div class="page-head">
        <div>
          <h1>Création de compte Netflix</h1>
          <p class="muted">Une seule offre. Chaque client commande le sien. Aucun mot de passe n'est affiché.</p>
        </div>
      </div>
      <div class="filters">
        <input class="input" id="q" type="search" placeholder="Recherche instantanée (nom, catégorie...)">
        <select class="select" id="cat"><option value="">Toutes les catégories</option></select>
        <select class="select" id="max">
          <option value="">Tous les prix</option>
          <option value="3000">Jusqu'à 3 000 FCFA</option>
          <option value="5000">Jusqu'à 5 000 FCFA</option>
          <option value="10000">Jusqu'à 10 000 FCFA</option>
        </select>
        <select class="select" id="sort">
          <option value="pop">Tri : popularité</option>
          <option value="price-asc">Prix croissant</option>
          <option value="price-desc">Prix décroissant</option>
        </select>
      </div>
      <div class="grid grid-3" id="services-grid"></div>
      <div id="services-pager" class="pager"></div>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script src="js/services.js"></script>
</body>
</html>
