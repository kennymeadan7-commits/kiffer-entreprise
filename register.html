<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — StreamMarket</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-shell">
    <div class="container auth-wrap">
      <div class="card">
        <h1>Créer un compte</h1>
        <p class="muted">Compte client ou vendeur. Le mot de passe est hashé sur le serveur. Aucun identifiant d'éditeur n'est demandé.</p>
        <form id="register-form">
          <label>Nom</label>
          <input class="input" id="name" required placeholder="Votre nom" style="margin:8px 0 14px">
          <label>Email</label>
          <input class="input" id="email" type="email" required style="margin:8px 0 14px">
          <label>Mot de passe</label>
          <input class="input" id="password" type="password" required minlength="6" style="margin:8px 0 14px">
          <label class="pay-option" style="margin-bottom:14px"><input type="checkbox" id="role"> Je m'inscris comme vendeur (offres légales uniquement)</label>
          <p id="auth-error" style="color:#dc2626"></p>
          <button class="btn btn-primary btn-block" type="submit">S'inscrire</button>
        </form>
        <p class="muted" style="margin-top:14px">Déjà inscrit ? <a href="login.html">Connexion</a></p>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>document.addEventListener("DOMContentLoaded", async function(){ await SM.boot(); SM.initLayout(); });</script>
</body>
</html>
